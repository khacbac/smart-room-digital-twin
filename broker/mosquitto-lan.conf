# M3 broker config (docs/link-protocol.md §6.1): a real gateway board on the same Wi-Fi
# reaches this PC's LAN IP. Anonymous, no TLS: trusted home/lab LAN only, never
# port-forward. Windows asks to allow mosquitto through the firewall on first run
# (private networks only).
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location ./mosquitto-data/
autosave_interval 10
