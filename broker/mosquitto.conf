# Dev broker config (spec §6.1). Local only — never port-forward this listener.
listener 1883 127.0.0.1      # use 0.0.0.0 only if the gateway/broker runs in Docker/WSL
allow_anonymous true
persistence true             # keep retained status across broker restarts
persistence_location ./mosquitto-data/
autosave_interval 10         # seconds; default 1800 loses retained status if the broker is killed
