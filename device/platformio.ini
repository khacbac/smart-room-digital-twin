; Spec §4.7 / D13: Arduino core 2.x via the official espressif32 platform, all versions pinned.
; espressif32@6.13.0 ships framework-arduinoespressif32 2.0.17.

[platformio]
default_envs = esp32-s3

; lib/edge_rules includes config.h (thresholds, timing). PlatformIO does not put the
; project include/ dir on a library's path, so every env adds it.
[env]
build_flags = -I include

[env:esp32-s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
test_ignore = *
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
    beegee-tokyo/DHT sensor library for ESPx@1.19
    madhephaestus/ESP32Servo@3.0.9
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; Host-side unit tests for lib/edge_rules and lib/protocol (pure C++, no Arduino).
; Windows: MSYS2 UCRT64 gcc, put first in PATH by scripts/native_toolchain.py (see README).
[env:native]
platform = native@1.2.1
test_framework = unity
build_src_filter = -<*>
build_flags = ${env.build_flags} -static
lib_deps =
    bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:scripts/native_toolchain.py
