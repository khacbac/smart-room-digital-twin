; Spec §4.7 / D13: Arduino core 2.x via the official espressif32 platform, all versions pinned.
; espressif32@6.13.0 ships framework-arduinoespressif32 2.0.17.

[platformio]
default_envs = esp32-s3
; Real-board Wi-Fi + broker for env:gateway, gitignored (see secrets.ini.example).
extra_configs = secrets.ini

; lib/edge_rules includes config.h (thresholds, timing). PlatformIO does not put the
; project include/ dir on a library's path, so every env adds it.
[env]
build_flags = -I include

[env:esp32-s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
test_ignore = *
build_src_filter = +<*> -<net_link.cpp> -<gateway/>
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
    beegee-tokyo/DHT sensor library for ESPx@1.19
    madhephaestus/ESP32Servo@3.0.9
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; Node board of the 2-board split (docs/link-protocol.md): same sensors, rules and
; actuators as esp32-s3, but no Wi-Fi. The uplink is lib/link over UART1 to the gateway
; (src/net_link.cpp instead of src/net_task.cpp). Dev without the gateway:
;   pnpm --filter @srdt/link-sim fake-gateway --link serial:COMx   (USB-UART on PIN_LINK_RX/TX)
[env:node]
extends = env:esp32-s3
build_src_filter = +<*> -<net_task.cpp> -<gateway/>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    beegee-tokyo/DHT sensor library for ESPx@1.19
    madhephaestus/ESP32Servo@3.0.9
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; Gateway board of the 2-board split: Wi-Fi + NTP + MQTT (src/net_task.cpp, as on the
; single board) bridged to the node over UART1 by lnk::GatewayLink (src/gateway/).
; No sensors, no edge rules, no main.cpp. Dev without the node:
;   pnpm --filter @srdt/link-sim fake-node --link serial:COMx   (USB-UART on PIN_LINK_RX/TX)
[env:gateway]
extends = env:esp32-s3
build_src_filter = -<*> +<net_task.cpp> +<gateway/>
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3

; Wokwi builds (device/wokwi/node, device/wokwi/gateway). Wokwi's one serial monitor
; carries the link, so -D LINK_CONSOLE_TEE copies the console onto the link UART
; (src/console_tee.cpp) and link-sim prints it. Not for the real boards.
[env:node-wokwi]
extends = env:node
build_flags = ${env.build_flags} -D LINK_CONSOLE_TEE -Wl,--wrap=uart_write_bytes

[env:gateway-wokwi]
extends = env:gateway
build_src_filter = ${env:gateway.build_src_filter} +<console_tee.cpp>
build_flags = ${env.build_flags} -D LINK_CONSOLE_TEE -Wl,--wrap=uart_write_bytes

; Starter kit on a classic ESP32 (ESP-32S / esp32dev): DHT11, light module, IR module,
; PIR, 3 buttons, 2-channel relay (window), passive buzzer, OLED 0.96" (config.h
; BOARD_KIT, wiring in docs/hardware-kit.md). Same main.cpp, rules and MQTT contract.
;   kit       one board, Wi-Fi + MQTT itself (like esp32-s3); broker/Wi-Fi from secrets.ini
;   node-kit  sensor board of the 2-board split, uplink over UART1 (like node)
[kit_base]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
build_flags = ${env.build_flags} -D BOARD_KIT
kit_lib_deps =
    bblanchon/ArduinoJson@7.4.3
    beegee-tokyo/DHT sensor library for ESPx@1.19
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

[env:kit]
extends = kit_base
build_src_filter = +<*> -<net_link.cpp> -<gateway/>
lib_deps =
    knolleary/PubSubClient@2.8
    ${kit_base.kit_lib_deps}

[env:node-kit]
extends = kit_base
build_src_filter = +<*> -<net_task.cpp> -<gateway/>
lib_deps = ${kit_base.kit_lib_deps}

; Host-side unit tests for lib/edge_rules and lib/protocol (pure C++, no Arduino).
; Windows: MSYS2 UCRT64 gcc, put first in PATH by scripts/native_toolchain.py (see README).
[env:native]
platform = native@1.2.1
test_framework = unity
build_src_filter = -<*>
build_flags = ${env.build_flags} -static
lib_deps =
    bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:scripts/native_toolchain.py
