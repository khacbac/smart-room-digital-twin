# Node board (env:node) in Wokwi, with fake-gateway as the gateway (docs/link-protocol.md §6.2).
# Wokwi exposes one serial port: here it is wired to the link UART (GPIO4/5), not to the
# console, and served as RFC 2217 on TCP 4000:
#   pio run -e node
#   (VS Code) "Wokwi: Select Config File" → device/wokwi/node/wokwi.toml, then "Wokwi: Start Simulator"
#   pnpm --filter @srdt/link-sim fake-gateway --link rfc2217:127.0.0.1:4000
[wokwi]
version = 1
firmware = '../../.pio/build/node/firmware.bin'
elf = '../../.pio/build/node/firmware.elf'
rfc2217ServerPort = 4000
